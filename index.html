<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2C3E50">
    <title>ZeroDebt - 스마트 학습 스케줄러</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('tab-dashboard')">
            <i class="fa-solid fa-house"></i>
            <span>오늘</span>
        </button>
        <button class="nav-btn" onclick="switchTab('tab-calendar')">
            <i class="fa-solid fa-calendar-days"></i>
            <span>달력</span>
        </button>
        <button class="nav-btn" onclick="switchTab('tab-goals')">
            <i class="fa-solid fa-bullseye"></i>
            <span>목표</span>
        </button>
        <button class="nav-btn" onclick="switchTab('tab-settings')">
            <i class="fa-solid fa-sliders"></i>
            <span>설정</span>
        </button>
    </nav>

    <div class="app-container">
        <header>
            <div class="header-content">
                <h1><i class="fa-solid fa-layer-group"></i> ZeroDebt</h1>
                <p>스마트 학습 스케줄러</p>
            </div>
            <div class="header-actions">
                <button id="syncBtn" class="btn btn-primary"><i class="fa-solid fa-cloud"></i> 동기화</button>
                <button id="undoPostponeBtn" class="btn btn-danger" style="display: none;"><i class="fa-solid fa-rotate-left"></i> 미루기 취소</button>
                <button id="addUnexpectedBtn" class="btn btn-warning"><i class="fa-solid fa-bolt"></i> 돌발 변수</button>
            </div>
        </header>

        <main>
            <!-- TAB: DASHBOARD -->
            <section id="tab-dashboard" class="tab-pane active">
            <div class="grid-layout">
                <!-- Left Column (Dashboard & Generated Tasks) -->
                <div class="left-col">
                    <section class="glass-panel summary-section">
                         <h2><i class="fa-solid fa-chart-pie"></i> 오늘의 학습 요약</h2>
                         <div class="summary-box">
                             <div class="summary-item">
                                 <span class="summary-label">오늘 할당된 총 단위</span>
                                 <span class="summary-value" id="todayTaskCount">0 단위</span>
                             </div>
                         </div>
                    </section>

                    <section class="glass-panel tasks-section">
                        <h2><i class="fa-solid fa-list-check"></i> 오늘의 자동 생성 체크리스트</h2>
                        <div class="progress-container">
                            <div class="progress-labels">
                                <span>오늘의 진척도 (분량 기준)</span>
                                <span id="progressText">0%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div id="progressBar" class="progress-bar-fill"></div>
                            </div>
                        </div>
                        <ul id="taskList" class="task-list">
                            <!-- Tasks will be injected here -->
                        </ul>
                    </section>
                </div>

                    <section class="glass-panel garden-section mt-24">
                        <h2><i class="fa-solid fa-star"></i> 현재 성취도</h2>
                        <div class="streak-badge" style="margin-bottom: 15px;">
                            <i class="fa-solid fa-fire" style="color: #f59e0b;"></i> <span id="streakCount">0</span>일 연속 달성
                        </div>
                        <div id="gardenArea" class="garden-area" style="text-align: center; padding: 20px 0;">
                            <i id="gardenIcon" class="fa-solid fa-circle-check" style="font-size: 3rem; color: var(--primary-light); margin-bottom: 15px; transition: all 0.3s ease;"></i>
                            <p id="gardenText" class="garden-text" style="font-weight: 500; font-size: 1.1rem;">오늘의 학습을 시작해보세요!</p>
                        </div>
                    </section>
                </div>
            </section>

            <!-- TAB: CALENDAR -->
            <section id="tab-calendar" class="tab-pane">
                <div class="grid-layout">
                    <div class="left-col" style="grid-column: 1 / -1;">
                        <section class="dashboard-section">
                        <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
                            <h2><i class="fa-solid fa-calendar-days"></i> 스케줄 캘린더</h2>
                            <div class="calendar-nav">
                                <button class="btn btn-sm btn-primary" id="prevMonthBtn"><i class="fa-solid fa-chevron-left"></i></button>
                                <span id="calendarMonthLabel" style="font-weight:600; font-size:1.1rem; margin: 0 15px;">2026년 7월</span>
                                <button class="btn btn-sm btn-primary" id="nextMonthBtn"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="glass-panel">
                            <div class="calendar-dow">
                                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                            </div>
                            <div id="calendarGrid" class="calendar-grid">
                                <!-- Calendar will be populated by JS -->
                            </div>
                        </div>
                    </section>
                        </div>
                    </section>
                </div>
            </section>

            <!-- TAB: GOALS -->
            <section id="tab-goals" class="tab-pane">
                <div class="grid-layout">
                    <div class="left-col" style="grid-column: 1 / -1;">
                        <section class="glass-panel add-task-section">
                        <h2><i class="fa-solid fa-bullseye"></i> 새 장기 목표 등록</h2>
                        <form id="addGoalForm">
                            <div class="form-group">
                                <label for="goalSubject">과목</label>
                                <select id="goalSubject" required>
                                    <option value="math">수학</option>
                                    <option value="science">과학</option>
                                    <option value="english">영어</option>
                                    <option value="korean">국어</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="goalName">목표명</label>
                                <input type="text" id="goalName" placeholder="예: 미적분 1 인강 수강" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">총 분량</label>
                                <div style="display: flex; gap: 10px;">
                                    <input type="number" class="form-control" id="goalTotalUnits" placeholder="예: 40" required min="1" style="flex: 2;">
                                    <input type="text" class="form-control" id="goalUnitString" placeholder="예: 강, 문제, 쪽" required style="flex: 1;">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="goalDeadline">마감일</label>
                                <input type="date" id="goalDeadline" required>
                            </div>
                            <div class="form-group">
                                <label for="goalPriority">우선순위 (1순위가 앞날짜에 집중 배치됨)</label>
                                <select id="goalPriority" required>
                                    <option value="1">1순위 (필수/최우선)</option>
                                    <option value="2">2순위 (보통)</option>
                                    <option value="3">3순위 (선택/후순위)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">목표 등록 및 자동 스케줄링</button>
                        </form>
                        </form>
                    </section>

                    <section class="glass-panel all-goals-section mt-24">
                        <h2><i class="fa-solid fa-list"></i> 진행 중인 전체 목표 현황</h2>
                        <div class="table-container">
                            <table id="goalsTable" class="goals-table">
                                <thead>
                                    <tr>
                                        <th>과목</th>
                                        <th>목표명</th>
                                        <th>전체 진척도</th>
                                        <th>마감일</th>
                                        <th>우선순위</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Goals will be injected here -->
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </section>

            <!-- TAB: SETTINGS -->
            <section id="tab-settings" class="tab-pane">
                <div class="grid-layout">
                    <div class="left-col" style="grid-column: 1 / -1;">
                        <section class="glass-panel settings-section">
                        <h2><i class="fa-solid fa-sliders"></i> 스케줄링 환경 설정</h2>
                        <div class="settings-group">
                            <label>넉넉한 요일 (여유 시간)</label>
                            <div class="day-checkboxes">
                                <label><input type="checkbox" value="1" class="avail-day"> 월</label>
                                <label><input type="checkbox" value="2" class="avail-day"> 화</label>
                                <label><input type="checkbox" value="3" class="avail-day"> 수</label>
                                <label><input type="checkbox" value="4" class="avail-day"> 목</label>
                                <label><input type="checkbox" value="5" class="avail-day"> 금</label>
                                <label><input type="checkbox" value="6" class="avail-day"> 토</label>
                                <label><input type="checkbox" value="0" class="avail-day"> 일</label>
                            </div>
                            <div class="form-group mt-10">
                                <label for="availMultiplier">넉넉한 날의 학습량 배율 (일반 요일 대비)</label>
                                <input type="number" id="availMultiplier" value="2.0" step="0.5" min="1.0">
                            </div>
                        </div>

                        <div class="settings-group">
                            <label>📧 이메일 알림 시간 설정 (자동 푸시)</label>
                            <div class="date-range-inputs">
                                <input type="time" id="notificationTimeInput">
                                <button id="addNotificationTimeBtn" class="btn btn-primary btn-sm">추가</button>
                                <button id="testEmailBtn" class="btn btn-secondary btn-sm" style="margin-left: 10px;">🔔 테스트 발송</button>
                            </div>
                            <ul id="notificationTimeList" class="period-list"></ul>
                            <small style="color: #e74c3c; display: block; margin-top: 5px;">* 시간 변경 시 백엔드 구글 권한 재인증이 필요할 수 있습니다.</small>
                        </div>

                        <div class="settings-group">
                            <label>넉넉한 기간 추가 (방학 등)</label>
                            <div class="date-range-inputs">
                                <input type="date" id="availStartDate">
                                <span>~</span>
                                <input type="date" id="availEndDate">
                                <button id="addAvailPeriodBtn" class="btn btn-primary btn-sm">추가</button>
                            </div>
                            <ul id="availPeriodList" class="period-list"></ul>
                        </div>

                        <div class="settings-group">
                            <label>학습 불가 기간 추가 (여행, 시험 등)</label>
                            <div class="date-range-inputs">
                                <input type="date" id="blackoutStartDate">
                                <span>~</span>
                                <input type="date" id="blackoutEndDate">
                                <button id="addBlackoutPeriodBtn" class="btn btn-danger btn-sm">추가</button>
                            </div>
                            <ul id="blackoutPeriodList" class="period-list"></ul>
                        </div>
                    </section>
                </div>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="editGoalModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel">
            <h2><i class="fa-solid fa-pen"></i> 목표 수정</h2>
            <form id="editGoalForm">
                <input type="hidden" id="editGoalId">
                <div class="form-group">
                    <label for="editGoalName">목표명</label>
                    <input type="text" id="editGoalName" required>
                </div>
                <div class="form-group">
                    <label for="editGoalDeadline">마감일</label>
                    <input type="date" id="editGoalDeadline" required>
                </div>
                <div class="form-group">
                    <label for="editGoalPriority">우선순위</label>
                    <select id="editGoalPriority" required>
                        <option value="1">1순위 (필수/최우선)</option>
                        <option value="2">2순위 (보통)</option>
                        <option value="3">3순위 (선택/후순위)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editGoalTotalUnits">총 분량</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="editGoalTotalUnits" min="1" required style="flex: 2;">
                        <input type="text" id="editGoalUnitString" placeholder="예: 강, 문제" required style="flex: 1;">
                    </div>
                </div>
                <div class="flex-row" style="margin-top: 20px;">
                    <button type="button" class="btn btn-danger w-100" onclick="closeEditModal()">취소</button>
                    <button type="submit" class="btn btn-primary w-100">저장 및 재분배</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <div id="confetti" class="confetti-container"></div>

    <script src="app.js?v=3"></script>
</body>
</html>
